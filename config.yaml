# Non-secret configuration. Committed on purpose: every value here is an input to an eval score,
# so it must be reviewable in a diff and pinnable to a git SHA.
#
# Secrets do NOT belong here — they live in `.env`, which is git-ignored. `make scan` treats a
# credential-shaped assignment in a committed file as a blocking error, so this file is checked.
#
# Nothing here is readable from an environment variable, by design: an env var is invisible to git,
# so a run configured by one cannot be reproduced from the repo. For a one-off experiment, pass an
# explicit flag that the run record captures rather than exporting a variable.
#
# Schema and rationale: src/health_coverage_navigator/config.py

agent:
  # PydanticAI model string, `provider:model`.
  #
  # A FLOATING ALIAS, AND THAT IS A KNOWN COST. An eval score is a measurement, and the repo pins
  # the other half of the pairing — docs/lancedb.md chose LanceDB partly for versioned writes, so a
  # score could be tied to the corpus snapshot it was measured against. A dated model snapshot
  # (`gpt-5.4-mini-2026-03-17`) closes the same hole from the model side.
  #
  # OpenAI publishes no dated snapshot for the `gpt-5.6-*` family — only the bare alias — so this
  # choice accepts that a rerun can silently differ from its baseline. The mitigation is to record
  # `Config.fingerprint()` and the resolved model on every eval run. Models that *do* publish a
  # snapshot should be pinned to it; see ALLOWED_FLOATING_MODELS in tests/test_config.py.
  model: openai:gpt-5.6-luna

  # How many times a rejected answer may be re-attempted. This is the GROUNDING GUARDRAIL'S BUDGET,
  # not generic error handling: agent/runtime.py's output validator rejects a citation of a chunk
  # no tool returned, a snippet that is not verbatim in its chunk, or a [cN] marker pointing at
  # nothing — and hands the model the reason. Two covers the realistic slips (a mistyped chunk id,
  # a paraphrased quotation) and stops short of burning a run on a model that has decided to cite
  # something it never read.
  retries: 2

  # Loop safety, in from day one rather than with Phase 4 (docs/plan.md §1a: cheap now, painful to
  # retrofit). Phase 4 adds cycle detection ON TOP of these.
  #
  # request_limit counts model calls in one run: one to plan the first search, a few to read
  # results and search again, one to answer, plus the retry budget above. tool_calls_limit is the
  # real ceiling on a model that keeps reformulating a query it will never satisfy — without it the
  # failure is a spinner until the request times out, instead of an answer or an honest abstention.
  #
  # RAISED FROM 8/12 BY MEASUREMENT, at Phase 1-c. A reference question spends two or three model
  # calls: search, maybe search again, answer. A plan question spends `list_tables`, then
  # `describe_table` (often twice — a 151-column table is read through the `contains` filter), then
  # `query_structured`, then a corrected query when a column name was guessed wrong, then the
  # answer. The first structured eval run lost str-01 outright to
  # `UsageLimitExceeded: the next request would exceed the request_limit of 8` — a working
  # capability recorded as a failed question, which is the worst way for a ceiling to be wrong.
  # 12/16 leaves room for that path plus the grounding retries, and is still far below the runaway
  # loop these exist to stop.
  request_limit: 12
  tool_calls_limit: 16

  # Transport-level retries, which is a DIFFERENT THING from `retries` above: that one is about
  # whether an answer is grounded, this one is about whether the request arrived. The OpenAI SDK
  # retries 429s and 5xx with backoff and honours the delay the server asks for.
  #
  # Five rather than the SDK's default of two, measured: `make eval --concurrency 5` put 16 of 35
  # questions into an ERR row on `Rate limit reached ... on tokens per min (TPM)`, each one asking
  # to be retried in under three seconds. A transient rate limit that lands in an eval run as a
  # failed question does not just lose that question — it moves the headline score, which is worse
  # than being slow.
  request_retries: 5

  # Which retrieval tools the agent may see: `lexical` (Phase 1a's search_corpus + grep_corpus),
  # `vector` (Phase 1b's vector_search), or `both`. The navigation tools — get_chunk,
  # list_documents — are in every configuration, because they are how a hit is widened rather than
  # how one is found; removing them from a vector-only run would measure "lost the ability to widen
  # a hit" alongside "vector vs lexical", which are different things.
  #
  # `both` is the configuration the product would actually ship, so it is the default and the one
  # that gets the most use. The eval runner's `--toolset` overrides this for a single run and
  # records which was used, so a comparison is one runner with a flag rather than three code paths
  # (docs/plan.md §1b).
  toolset: both

  # Whether the agent sees the Phase 1-c relational lane — list_tables / describe_table /
  # query_structured over the vendored CMS plan data. A SEPARATE SWITCH from `toolset` above, not a
  # fourth value of it: `toolset` picks how the reference corpus is searched, this picks whether a
  # second KIND of source exists at all. Folding them together would make six combinations, three
  # of them meaningless, and would redefine the three names Phase 1b's measurement is recorded
  # under.
  #
  # Requires the Parquet mirrors (`make puf`). With this true and the mirrors missing, the app
  # returns a 503 naming the command rather than quietly answering plan questions from prose —
  # the same refusal-to-degrade as a missing vector store.
  structured_tools: true

retrieval:
  # Matches the eval set's headline metric (recall@5), so a retrieval change and its measurement
  # cannot drift apart.
  top_k: 5

  # BM25 term-frequency saturation. Swept 0.6/0.9/1.2/1.5/2.0 x b 0.0..1.0 against the 30
  # in-corpus gold questions (`make eval-retrieval`). 2.0 was best at every k and on both metrics
  # — recall@5 0.567 vs 0.500 at the standard 1.2, MRR 0.416 vs 0.386 — but the margin is TWO
  # QUESTIONS out of thirty, which a set this small cannot resolve. Read it as "no evidence the
  # standard value is better here", not as a tuned optimum, and do not chase further decimals on
  # this set. Re-measure when the gold set grows.
  bm25_k1: 2.0

  # BM25 length normalisation, 0 = off, 1 = full. docs/chunking.md §5 handed this forward as THE
  # ONE TO TUNE FIRST, on the worry that 505 of 2,256 NCD chunks are under 200 chars and length
  # normalisation may over-favour them. Measured: it does not. Sweeping b from 0.0 to 1.0 moves
  # recall@5 by at most one question at any k1, so the worry did not materialise and the standard
  # value stands. That closes the question chunking.md opened; the short NCD sections are fine.
  bm25_b: 0.75

# Phase 1b semantic retrieval. WARNING: `embedding_model` and `dimensions` are pinned by the
# committed `data/processed/vectors_meta.json`. Changing either is not a config tweak — it
# invalidates all 6,722 stored vectors and needs `make embed` in the same change, or
# `make embed-check` fails and the app refuses to open the store. Rationale: docs/lancedb.md.
vectors:
  # OpenAI's small embedding model. The SAME MODEL EMBEDS DOCUMENTS AND QUERIES — one key rather
  # than two, because two keys is a way to end up comparing incompatible embedding spaces.
  #
  # `-3-small` over `-3-large`: a full ingest is ~1.7M tokens, so small costs ~$0.04 against
  # large's ~$0.26 — both trivial — but large is 3,072-dimensional, doubling both the store
  # (41 MB -> 82 MB) and per-query latency. The deciding argument is the measurement, not the
  # money: there are 30 in-corpus gold questions, and a set that size cannot resolve the
  # difference between two good embedding models. `make eval-retrieval-vector` is the cheap,
  # deterministic instrument if that is ever worth testing rather than assuming.
  embedding_model: text-embedding-3-small

  # Native dimensionality of the model above, NOT a truncation via the API's `dimensions`
  # parameter. Stated rather than inferred so the Arrow schema, the manifest, and the store can
  # never quietly disagree about a table that costs a paid call to rebuild.
  dimensions: 1536

  # How many passages `vector_search` returns by default. Matches `retrieval.top_k` (and so the
  # headline recall@5) but is deliberately its own key: Phase 1b exists to compare the two
  # retrieval paths, and a shared value would make "return more" untestable on one side alone.
  top_k: 5

  # Inputs per embeddings request during `make embed`; a query embeds one string and never reads
  # this. 128 puts the 6,722-chunk ingest in ~53 requests. Larger batches are fewer round trips
  # but put more work behind a single failure, and the whole build is under two minutes either way.
  batch_size: 128

# Phase 1-c relational lane. These bound a query the MODEL wrote, which is why they are ceilings
# rather than tunables: nothing here makes an answer better, and every value exists to make a bad
# query cheap. The guard itself (single SELECT, locked connection, sandboxed to data/processed) is
# code, not configuration — docs/relational-tool.md §4.
structured:
  # Rows one query may return before the result says it truncated. Every statement is wrapped in
  # this cap, so the model cannot forget to write LIMIT. Sized for LOOKUPS, which is what this
  # phase is for; Phase 5's plan comparisons are the thing that would justify raising it.
  max_rows: 200

  # Deadline for one statement, enforced by interrupting the cursor — DuckDB has no statement
  # timeout, so this is a threading.Timer, measured to fire within ~16 ms of the deadline. Very
  # generous against the 3-16 ms a real lookup takes: what it exists to catch is an accidental
  # cross join, not a slow filter.
  query_timeout_s: 5.0

  # DuckDB's working-memory ceiling for the whole connection. The mirrors are READ FROM PARQUET,
  # never loaded, so this does not have to hold the data — 1.46M rows of Benefits & Cost Sharing
  # sit on disk and are scanned. It bounds a hash join gone wrong.
  memory_limit: 512MB

  # DuckDB worker threads. Deliberately small: this shares a process with the API's event loop,
  # and a query that saturates every core makes an unrelated request look like a hang.
  threads: 2

evals:
  # The LLM judge behind `make eval-judge`, which grades each answer against the gold set's
  # `answer_key_facts`. Deliberately a SEPARATE KEY from agent.model rather than a reuse of it: a
  # judge that is the same model as the thing it grades marks its own homework, and the failure is
  # invisible — it agrees with itself most confidently exactly where both are wrong. Point this at
  # a different family when the budget allows.
  #
  # Not reachable from the UI, by design. A button that spends money on every click is the wrong
  # affordance; `make eval-judge` is an explicit act. The deterministic graders (groundedness,
  # citation resolution) run on every `make eval` and cost nothing.
  judge_model: openai:gpt-5.6-terra

# WARNING: these five keys, their names, and their values are pinned by the committed
# `data/processed/*/chunks_meta.json` manifests via `params_sha256` and `snapshot_id`. Changing any
# of them invalidates all three; run `make chunk` in the same change or `make chunk-check` fails.
# Measurements behind each value: docs/chunking.md.
chunking:
  # ~300 tokens. The NCD median section body (832) and the healthcare_gov median doc (904) both
  # fit, so the typical retrieval unit survives whole and only the tail splits.
  max_chars: 1200

  # Set by the gold set, not by taste: the longest `expected_snippet` is 279 chars, so an overlap
  # above that makes "a snippet is wholly inside at least one chunk" a guarantee rather than an
  # observation. See `splitter.split_span` for why the snap direction matters.
  overlap_chars: 320

  # A trailing sliver shorter than this is merged back into its predecessor (never across a
  # section heading).
  min_tail_chars: 300

  # A boundary is only used if it fills at least this much of the budget; otherwise the ladder
  # falls to the next rung. Stops one early sentence break from emitting a 60-char chunk.
  min_fill_chars: 480

  # Whitespace-normalized floor for a *document* to be chunked at all. Drops the 29 medicare_pubs
  # pages that extract to "Notes" or a cover fragment, and nothing else.
  min_doc_chars: 40
