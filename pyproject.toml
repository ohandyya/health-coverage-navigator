[project]
name = "health-coverage-navigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "lancedb>=0.37.1",
    "openai>=3.0.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.30.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tavily-python>=0.7.27",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
health-coverage-navigator = "health_coverage_navigator:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
# `tests/` is not a package and `scripts/` is not installed, so both are imported by path at
# runtime — `tests/test_synthetic.py` checks the synthetic-NPI generator against the *scanner's own*
# `npi_luhn` validator, which is the point of that test (two independent implementations that must
# agree). Without this, pyright cannot resolve either module and the check fails on an import that
# works fine.
extraPaths = ["scripts", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["health_coverage_navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `auto`, so an `async def test_` just runs — no per-test decorator. The repo's other async code is
# driven by `asyncio.run` at the boundary (tests/conftest.py's AgentKit), which stays as it is:
# those tests exercise a synchronous API and should read as synchronous. Only the evals suite is
# async, because `run_gold_set` and the answerer/grader seam genuinely are.
asyncio_mode = "auto"
# Each test gets a fresh event loop. The alternative (a session-wide loop) leaks state between
# tests via anything that caches a loop-bound object, which is exactly the kind of order-dependent
# failure that is miserable to track down.
asyncio_default_fixture_loop_scope = "function"
